    <circle cx="1114" cy="131" r="4" fill="#9BE8BE" opacity=".76"/>
    <rect x="932" y="40" width="170" height="170" rx="31" fill="#142720" fill-opacity=".86" stroke="#76BB95" stroke-opacity=".56"/>
    <rect x="945" y="53" width="144" height="144" rx="24" fill="none" stroke="#76BB95" stroke-opacity=".23"/>
    <g transform="translate(948 56) scale(.85)" fill="none" stroke="#9BE8BE" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"><rect x="45" y="46" width="72" height="72" rx="9"/><rect x="64" y="65" width="34" height="34" rx="5"/><path d="M60 46V28 M81 46V28 M102 46V28 M60 118v18 M81 118v18 M102 118v18 M45 61H27 M45 82H27 M45 103H27 M117 61h18 M117 82h18 M117 103h18"/></g>
