<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="project-title project-description">
  <title id="project-title">Soft I²C</title>
  <desc id="project-description">A software I²C bus for Raspberry Pi.</desc>
  <defs>
    <linearGradient id="background">
      <stop offset="0" stop-color="#142720"/>
      <stop offset="1" stop-color="#1C4236"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9BE8BE" stop-opacity=".23"/>
      <stop offset="1" stop-color="#9BE8BE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="21" height="21" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#76BB95" opacity=".38"/>
    </pattern>
    <linearGradient id="accent">
      <stop stop-color="#9BE8BE"/><stop offset="1" stop-color="#76BB95" stop-opacity=".26"/>
    </linearGradient>
    <clipPath id="corners"><rect x="1" y="1" width="1198" height="258" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#corners)">
