name: "Validation"
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true
jobs:
  validate:
    name: "C unit tests"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 8
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "Run unit tests, sanitizers, and line coverage in Docker"
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            gcc:14-bookworm sh /src/tests/run-container-tests.sh soft_i2c | tee -a "$GITHUB_STEP_SUMMARY"
